<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video comparison study</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <!-- DataPipe plugin: check https://www.npmjs.com/package/@jspsych-contrib/plugin-pipe for the latest version -->
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.6.0"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
  <style>
    .src { display: flex; justify-content: center; margin-bottom: 8px; }
    .src video { height: 26vh; max-width: 44vw; background: #000; object-fit: contain; }
    .pair { display: flex; gap: 24px; justify-content: center; }
    .pair video { width: 46vw; max-width: 640px; height: 34vh; background: #000; object-fit: contain; }
    .label { font-weight: 600; margin: 6px 0; }
    .prompt { max-width: 900px; margin: 8px auto; text-align: left; padding: 8px 12px; background: #f3f3f3; border-radius: 6px; font-size: 15px; }
    #playbtn { margin: 10px 0; padding: 8px 28px; font-size: 16px; }
  </style>
</head>
<body></body>
<script>
// ====================== CONFIG: EDIT THESE ======================
const VIDEO_BASE_URL   = "https://pub-7315fa539539426aaf26d4e6616725a7.r2.dev/videos/";   // Cloudflare R2 public bucket URL
const PLAYLIST_BASE    = "playlists/playlist_";                  // files: playlists/playlist_0.json, _1.json ...
const NUM_PLAYLISTS    = 30;                                     // how many playlist files you made
const DATAPIPE_ID      = "eYpDmlWrvxp9";          // from pipe.jspsych.org
const COMPLETION_CODE  = "C68O3X9W";        // from Prolific study setup
const MIN_WIDTH        = 1000;                                   // block small screens
// =================================================================

// Playlist JSON format (list of trials):
// (each trial also has "source": clip name of the unedited source and "prompt": the edit instruction text)
// [{"id":"p001","kind":"new","left":"a.mp4","right":"b.mp4","source":"s.mp4","prompt":"..."},
//  {"id":"g001","kind":"golden","left":"c.mp4","right":"d.mp4","correct":"left"},
//  {"id":"r001","kind":"repeat","left":"b.mp4","right":"a.mp4","repeat_of":"p001"},
//  {"id":"a001","kind":"attention","left":"e.mp4","right":"f.mp4","correct":"left"}]

const jsPsych = initJsPsych({
  show_progress_bar: true,
  on_finish: () => {
    // Redirect back to Prolific so the submission is marked complete
    window.location.href = "https://app.prolific.com/submissions/complete?cc=" + COMPLETION_CODE;
  }
});

// Read Prolific parameters from the URL
const urlVars = jsPsych.data.urlVariables();
const PID = urlVars.PROLIFIC_PID || "NO_PID_" + Date.now();
jsPsych.data.addProperties({
  prolific_pid: PID,
  study_id: urlVars.STUDY_ID || "",
  session_id: urlVars.SESSION_ID || ""
});

const esc = (x) => String(x || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const timeline = [];

// 1. Device gate: desktop-sized screens only
if (window.innerWidth < MIN_WIDTH || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
  document.body.innerHTML = "<h2>Please open this study on a desktop or laptop computer with a larger window, then reopen it from Prolific.</h2>";
  throw new Error("Unsupported device");
}

// 2. Consent + instructions
timeline.push({
  type: jsPsychInstructions,
  pages: [
    "<h2>Consent</h2><p>PASTE YOUR ETHICS-APPROVED INFORMATION AND CONSENT TEXT HERE. By continuing you agree to take part.</p>",
    "<h2>Instructions</h2><p>Each trial shows an original <b>source video</b> (top), an <b>editing instruction</b>, and two edited versions, Video A and Video B. All three play together; press Play and watch the whole clip (you can replay it). Then choose which edited video is better overall: it follows the instruction, keeps the rest of the source video intact, and looks natural and clean. Some trials check your attention; follow their on-screen instructions exactly.</p>"
  ],
  show_clickable_nav: true,
  button_label_next: "Continue"
});

// 3. Get a playlist via DataPipe balanced assignment, then load it
// Local test mode: ?local=1&playlist=N skips DataPipe (no assignment, no saving)
const LOCAL = !!urlVars.local;
timeline.push({
  timeline: [{
  type: jsPsychPipe,
  action: "condition",
  experiment_id: DATAPIPE_ID,
  num_conditions: NUM_PLAYLISTS,
  on_finish: (data) => { window.__playlist = data.result; jsPsych.data.addProperties({ playlist_id: data.result }); }
  }],
  conditional_function: () => !LOCAL
});

// 4. Trial definition; the block is appended to the timeline once the playlist has been fetched
const trialDef = {
    type: jsPsychHtmlButtonResponse,
    stimulus: () => {
      const t = jsPsych.timelineVariable("t");
      const v = (id, name) => `<video id="${id}" src="${VIDEO_BASE_URL}${name}" preload="auto" muted playsinline></video>`;
      return `<div class="src"><div><div class="label">Source video (original)</div>${v("vS", t.source)}</div></div>
      <div class="prompt"><b>Editing instruction:</b> ${esc(t.prompt)}</div>
      <div class="pair">
        <div><div class="label">Video A</div>${v("vL", t.left)}</div>
        <div><div class="label">Video B</div>${v("vR", t.right)}</div>
      </div>
      <button id="playbtn" type="button">Play</button>
      ${t.kind === "attention" ? "<p><b>Attention check: please choose Video A (left), regardless of quality.</b></p>" : "<p>Which edited video is better?</p>"}`;
    },
    choices: ["Video A is better", "Video B is better"],
    // lock the answer buttons until both videos have finished playing
    on_load: () => {
      const btns = document.querySelectorAll(".jspsych-btn");
      btns.forEach(b => b.disabled = true);
      const vids = ["vS", "vL", "vR"].map(id => document.getElementById(id));
      const [vS, vL, vR] = vids;
      const pb = document.getElementById("playbtn");
      let ended = [false, false, false];
      window.__plays = { S: 0, L: 0, R: 0 };
      // one control drives all three videos in sync; all must reach the end to unlock the answer
      vids.forEach((v, i) => v.addEventListener("ended", () => {
        ended[i] = true;
        if (ended.every(Boolean)) { btns.forEach(b => b.disabled = false); pb.textContent = "Replay"; }
      }));
      pb.addEventListener("click", () => {
        if (vids.some(v => !v.paused)) { vids.forEach(v => v.pause()); pb.textContent = "Play"; return; }
        if (ended.some(Boolean)) { vids.forEach(v => { v.currentTime = 0; }); ended = [false, false, false]; }
        window.__plays.S++; window.__plays.L++; window.__plays.R++;
        vids.forEach(v => v.play());
        pb.textContent = "Pause";
      });
    },
    data: () => {
      const t = jsPsych.timelineVariable("t");
      return { pair_id: t.id, kind: t.kind, left: t.left, right: t.right, source: t.source,
               correct: t.correct || "", repeat_of: t.repeat_of || "" };
    },
    on_finish: (data) => {
      data.chosen = data.response === 0 ? "left" : "right";
      data.is_correct = data.correct ? (data.chosen === data.correct) : "";
      data.plays_left = window.__plays.L;
      data.plays_right = window.__plays.R;
      data.plays_source = window.__plays.S;
    }
};

// Fetch the playlist, then append the trial block and the save step to the running timeline
timeline.push({
  type: jsPsychCallFunction,
  async: true,
  func: (done) => {
    const pid = LOCAL ? Number(urlVars.playlist || 0) : window.__playlist;
    if (!Number.isInteger(pid)) { document.body.innerHTML = "<h3>Could not get a playlist assignment. Please contact the researcher.</h3>"; return; }
    fetch(PLAYLIST_BASE + pid + ".json")
      .then(r => { if (!r.ok) throw new Error("playlist " + pid + " HTTP " + r.status); return r.json(); })
      .then(list => {
        // shuffle trial order per participant
        const shuffled = jsPsych.randomization.shuffle(list);
        jsPsych.addNodeToEndOfTimeline({ timeline: [trialDef], timeline_variables: shuffled.map(t => ({ t })) });
        if (!LOCAL) jsPsych.addNodeToEndOfTimeline(saveStep);
        done();
      })
      .catch(e => { document.body.innerHTML = "<h3>Could not load the study (" + e.message + "). Please contact the researcher.</h3>"; });
  }
});

// 5. Save all data via DataPipe (appended after the trials above), then on_finish redirects to Prolific
const saveStep = {
  type: jsPsychPipe,
  action: "save",
  experiment_id: DATAPIPE_ID,
  filename: `${PID}.csv`,
  data_string: () => jsPsych.data.get().csv()
};

jsPsych.run(timeline);
</script>
</html>
